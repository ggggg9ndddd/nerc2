<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوة ECONOVA — اكتب اسمك</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
  :root{--navy:#262449;--maroon:#a10133;--slate:#4b4e6f;--lav:#9a9fcf;--paper:#f8f8f8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--navy);font-family:"Alexandria","Segoe UI",Tahoma,sans-serif;
       min-height:100vh;display:flex;justify-content:center;padding:28px 18px 48px}
  main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px}
  .strip{height:10px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--slate) 0 25%,var(--lav) 25% 50%,var(--navy) 50% 75%,var(--maroon) 75% 100%);background-size:160px 100%}
  h1{font-size:1.45rem;font-weight:800;margin:6px 0 0;line-height:1.5;text-wrap:balance}
  p.lead{margin:0;color:var(--slate);font-size:.95rem;line-height:1.8}
  label{font-weight:700;font-size:.95rem;display:block;margin-bottom:8px}
  input{width:100%;font:inherit;font-size:1.1rem;font-weight:700;color:var(--navy);padding:14px 16px;border:2px solid var(--navy);
        border-radius:12px;background:#fff;text-align:center}
  input::placeholder{color:var(--lav);font-weight:500}
  input:focus-visible,button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
  button{font:inherit;font-weight:800;font-size:1.05rem;width:100%;padding:15px;border:0;border-radius:12px;background:var(--maroon);
         color:#fff;cursor:pointer;transition:transform .08s,opacity .2s}
  button:active{transform:scale(.98)}
  button[disabled]{opacity:.4;cursor:not-allowed}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--navy);border-radius:12px;overflow:hidden;background:#fff}
  .seg label{margin:0;padding:13px;text-align:center;font-weight:700;font-size:1.05rem;cursor:pointer;color:var(--navy)}
  .seg input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0}
  .seg input:checked + label{background:var(--navy);color:#fff}
  .seg input:focus-visible + label{outline:3px solid var(--lav);outline-offset:-3px}
  fieldset{border:0;padding:0;margin:0}
  fieldset[hidden]{display:none}
  legend{font-weight:700;font-size:.95rem;margin-bottom:8px;padding:0}
  .msg{min-height:1.6em;margin:0;font-size:.9rem;color:var(--slate);text-align:center;line-height:1.7}
  .frame{border-radius:18px;overflow:hidden;box-shadow:0 10px 34px rgba(38,36,73,.18);border:1px solid #e6e6ee;background:#fff;aspect-ratio:9/16}
  .frame img{display:block;width:100%;height:100%}
</style>
</head>
<body>
<main>
  <div class="strip" aria-hidden="true"></div>
  <h1 id="h1">دعوتك لمعرض ECONOVA جاهزة، بس ناقصها اسمك</h1>
  <p class="lead" id="lead">اكتب اسمك، نزّل الصورة، وشاركها في الستوري.</p>

  <fieldset>
    <legend>اللغة / Language</legend>
    <div class="seg">
      <input type="radio" name="lang" id="l-ar" value="ar" checked><label for="l-ar">عربي</label>
      <input type="radio" name="lang" id="l-en" value="en"><label for="l-en">English</label>
    </div>
  </fieldset>

  <fieldset id="genderSet">
    <legend id="lg-g">الدعوة لـ</legend>
    <div class="seg">
      <input type="radio" name="g" id="g-m" value="m" checked><label for="g-m">ولد</label>
      <input type="radio" name="g" id="g-f" value="f"><label for="g-f">بنت</label>
    </div>
  </fieldset>

  <div>
    <label for="name" id="lb-name">اسمك</label>
    <input id="name" type="text" maxlength="40" placeholder="اكتب اسمك هنا" autocomplete="name" enterkeyhint="done">
  </div>
  <button id="save" disabled>تنزيل الدعوة كصورة</button>
  <p class="msg" id="msg" role="status"></p>

  <div class="frame"><img id="preview" alt="معاينة دعوة ECONOVA"></div>
  <div class="strip" aria-hidden="true"></div>
</main>

const C = { navy:"#262449", maroon:"#a10133", slate:"#4b4e6f", lav:"#9a9fcf" };
const FONT = '"Alexandria","Segoe UI",Tahoma,sans-serif';

    lead: "اكتب اسمك، نزّل الصورة، وشاركها في الستوري.",
    legendG: "الدعوة لـ",
    nameLabel: "اسمك",
    placeholder: "اكتب اسمك هنا",
    button: "تنزيل الدعوة كصورة",

let L = T.ar;

const canvas = document.createElement("canvas"); canvas.width = W; canvas.height = H;
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);
const nameEl = $("name"), saveBtn = $("save"), msg = $("msg"), preview = $("preview");
const bg = new Image();

function text(str, x, y, size, weight, color, maxW, fam) {
  const F = fam ? `"${fam}",${FONT}` : FONT;
  ctx.direction = L.dir; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = color;
  let s = size;
  ctx.font = `${weight} ${s}px ${F}`;
  while (maxW && ctx.measureText(str).width > maxW && s > 18) { s -= 1; ctx.font = `${weight} ${s}px ${F}`; }
  ctx.fillText(str, x, y);
}
function pill(label, cx, cy, w, h) {
  ctx.fillStyle = C.maroon; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(cx - w/2, cy - h/2, w, h, 12); else ctx.rect(cx - w/2, cy - h/2, w, h);
  ctx.fill();
  ctx.textBaseline = "middle"; ctx.direction = L.dir; ctx.textAlign = "center";
  ctx.fillStyle = "#fff"; ctx.font = `700 30px ${FONT}`; ctx.fillText(label, cx, cy + 2);
}
function rule(x1, y1, x2, y2) {
  ctx.strokeStyle = C.lav; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function draw() {
  const name = nameEl.value.trim().replace(/\s+/g, " ");
  const f = L === T.ar && document.getElementById("g-f").checked;
  const MAXW = 880;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bg, 0, 0, W, H);

  /* 1 — the invitation and who it is for */
  pill(L.pill, CX, 400, L.pillW, 58);
  text(L.friend(f), CX, 484, 34, 500, C.maroon);
  text(name || L.ghost, CX, 592, 104, 400, name ? C.navy : C.lav, 900, "Lalezar");

  /* 2 — ECONOVA wordmark is in the background (y 670–935) */
  text(L.event, CX, 992, 31, 700, C.navy, MAXW);

  /* 3 — the message */
  text(L.big1(f), CX, 1082, 46, 800, C.navy, MAXW);
  text(L.big2, CX, 1146, 46, 800, C.maroon, MAXW);
  const lines = L.small(f);
  const ys = [1212, 1256, 1312, 1356];
  lines.forEach((s, i) => text(s, CX, ys[i], 29, 400, C.slate, MAXW));

  /* 4 — when and where, between two rules */
  rule(100, 1394, 980, 1394); rule(100, 1500, 980, 1500);
  for (const [x, w, a, b] of L.cols) { text(a, x, 1438, 28, 500, C.maroon, w - 20); text(b, x, 1480, 28, 500, C.maroon, w - 20); }
  for (const x of L.rules) rule(x, 1414, x, 1482);

  /* 5 — closing line */
  text(L.end1, CX, 1562, 36, 800, C.navy, MAXW);
  text(L.end2(f), CX, 1612, 36, 800, C.maroon, MAXW);

  saveBtn.disabled = !name;
  canvas.toBlob(b => {
    if (!b) return;
    const old = preview.src; preview.src = URL.createObjectURL(b);
    if (old.startsWith("blob:")) URL.revokeObjectURL(old);
  }, "image/png");
}

function applyLang() {
  L = document.getElementById("l-en").checked ? T.en : T.ar;
  const h = document.documentElement;
  h.lang = L.lang; h.dir = L.dir;
  document.title = L.title;
  $("h1").textContent = L.h1;
  $("lead").textContent = L.lead;
  $("lb-name").textContent = L.nameLabel;
  nameEl.placeholder = L.placeholder;
  saveBtn.textContent = L.button;
  preview.alt = L.alt;
  $("genderSet").hidden = L !== T.ar;
  if (L === T.ar) $("lg-g").textContent = L.legendG;
  msg.textContent = "";
  draw();
}

document.querySelectorAll('input[name="g"]').forEach(r => r.addEventListener("change", draw));
document.querySelectorAll('input[name="lang"]').forEach(r => r.addEventListener("change", applyLang));
let t; nameEl.addEventListener("input", () => { clearTimeout(t); t = setTimeout(draw, 120); msg.textContent = ""; });
nameEl.addEventListener("keydown", e => { if (e.key === "Enter") nameEl.blur(); });

saveBtn.addEventListener("click", async () => {
  draw();
  const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
  if (!blob) { msg.textContent = L.longpress; return; }
  const filename = L.file;
  if (window.claude && window.claude.use) {
    msg.textContent = L.wait;
    let dl = null; try { dl = await window.claude.use("downloads"); } catch (e) {}
    if (!dl) { msg.textContent = L.longpress; return; }
    try { await dl.save({ filename, data: blob }); msg.textContent = L.saved; }
    catch (e) { msg.textContent = e && e.code === "declined" ? "" : L.longpress; }
  } else {
    try {
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      msg.textContent = L.downloaded;
    } catch (e) { msg.textContent = L.longpress; }
  }
});

bg.onload = () => {
  draw();
  if (document.fonts && document.fonts.load) {
    const probe = "دعوة ECONOVA Name";
    Promise.all([400, 500, 700, 800].map(w => document.fonts.load(`${w} 40px "Alexandria"`, probe)).concat(document.fonts.load('400 40px "Lalezar"', probe)))
      .then(draw).catch(() => {});
  }
};
bg.src = BG_SRC;
